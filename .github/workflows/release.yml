name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  package:
    name: Release package ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: windows-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: linux-x86_64
          - os: macos-14
            target: aarch64-apple-darwin
            artifact: macos-aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup show
      - name: Verify tag matches Cargo version (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = ($metadata.packages | Where-Object name -eq 'harness-cli').version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "tag/version mismatch" }
      - name: Verify tag matches Cargo version (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | sed -n 's/.*"name":"harness-cli","version":"\([^"]*\)".*/\1/p' | head -n 1)
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/package-release.ps1 -Target '${{ matrix.target }}' -OutputDirectory dist
      - name: Package Unix
        if: runner.os != 'Windows'
        shell: bash
        run: sh scripts/package-release.sh '${{ matrix.target }}' dist
      - name: Stage npm Windows binary
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/npm-platform/win32-x64 | Out-Null
          Copy-Item target/${{ matrix.target }}/release/kernary.exe dist/npm-platform/win32-x64/kernary.exe
      - name: Stage npm Linux binary
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        shell: bash
        run: |
          mkdir -p dist/npm-platform/linux-x64-gnu
          cp target/${{ matrix.target }}/release/kernary dist/npm-platform/linux-x64-gnu/kernary
          chmod 755 dist/npm-platform/linux-x64-gnu/kernary
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kernary-${{ matrix.artifact }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
            dist/npm-platform/**
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Publish immutable archives and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' files < <(find dist -maxdepth 1 -type f -print0)
          gh release create "$GITHUB_REF_NAME" "${files[@]}" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"

  publish-npm:
    name: Publish npm packages
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Stage and verify npm packages
        run: |
          node npm/scripts/stage-platform-package.mjs win32-x64 dist/npm-platform/win32-x64/kernary.exe
          node npm/scripts/stage-platform-package.mjs linux-x64-gnu dist/npm-platform/linux-x64-gnu/kernary
          node npm/scripts/verify-packages.mjs
          npm pack --dry-run --json ./npm/kernary-code-win32-x64 >/dev/null
          npm pack --dry-run --json ./npm/kernary-code-linux-x64-gnu >/dev/null
          npm pack --dry-run --json ./npm/kernary-code >/dev/null
      - name: Publish platform packages then launcher
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish --access public ./npm/kernary-code-win32-x64
          npm publish --access public ./npm/kernary-code-linux-x64-gnu
          npm publish --access public ./npm/kernary-code
