# Kernary 五层配置中的 Project 层示例。
schema_version = 1

[settings]
mode = "balanced"

[settings.ui]
statusbar = true
language = "zh-CN"

[settings.vector]
# 这里只控制检索偏好；没有 Embedding Model 时 on 也不会创建向量设施。
mode = "auto"

[settings.permissions]
# manual | edit | auto | full | bypass；任何模式都不能绕过 Sandbox hard deny。
mode = "manual"

[settings.sandbox]
# read-only | workspace-write | danger-full-access；危险模式每次启动都要显式确认。
mode = "workspace-write"
# 默认 false；开启联网必须通过 /sandbox network-on 或启动参数显式确认。
network_access = false

[settings.failover]
# 默认关闭；开启时必须确认成本范围并使用精确 provider/model allowlist。
enabled = false
cost_confirmed = false
targets = ""

[settings.agents]
max = 8
parallel = 4
tokens = 100000
tools = 128
runtime_ms = 1800000
retries = 3
cost = 32

[settings.context]
window = 8192
tool_reserve = 1024

[settings.tools]
max_on_demand = 8
